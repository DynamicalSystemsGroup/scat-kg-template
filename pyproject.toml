[project]
name = "scat-vault"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["scat-tools[draw]"]

[dependency-groups]
# What `analysis.ipynb` needs: to open it (jupyterlab) and to run it headless (nbconvert).
notebook = ["jupyterlab", "nbconvert", "nbclient", "ipykernel", "jupyter-core"]

[tool.uv]
package = false
default-groups = ["notebook"]

[tool.uv.sources]
scat-tools = { git = "https://github.com/DynamicalSystemsGroup/scat-tools", rev = "087e7330294d44dce3e2abb800fd8e08de586298" }
