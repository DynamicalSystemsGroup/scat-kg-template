[project]
name = "scat-kg-vault"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["scat-kg[draw]"]

[dependency-groups]
# What `analysis.ipynb` needs: to open it (jupyterlab) and to run it headless (nbconvert).
notebook = ["jupyterlab", "nbconvert", "nbclient", "ipykernel", "jupyter-core"]

[tool.uv]
package = false
default-groups = ["notebook"]

[tool.uv.sources]
scat-kg = { git = "https://github.com/DynamicalSystemsGroup/scat-kg-tools", rev = "5e4ab1634940bd2b28b0c5dfc12510af40f591f3" }
